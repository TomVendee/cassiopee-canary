# Bases locales pour développer et lancer les tests d'intégration.
# Identifiants calqués sur ceux que Cassiopée génère (utilisateur postgres,
# base app). Ports hôtes décalés : 3306 est souvent déjà pris en local.
#
#   docker compose up -d --wait postgres mariadb mongo
#   CANARY_TEST_POSTGRES_URL=postgresql://postgres:canary@localhost:15432/app \
#   CANARY_TEST_MARIADB_URL=mysql://root:canary@localhost:13306/app \
#   CANARY_TEST_MONGODB_URL='mongodb://root:canary@localhost:37017/app?authSource=admin' \
#     go test -race -tags integration ./...
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: canary
      POSTGRES_DB: app
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: canary
      MARIADB_DATABASE: app
      MARIADB_USER: mariadb
      MARIADB_PASSWORD: canary
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: canary
    ports:
      - "37017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  # L'app elle-même, construite depuis le Dockerfile, branchée sur PostgreSQL.
  canary:
    build: .
    user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:canary@postgres:5432/app
      STARTUP_DELAY: "5"
      HELLO: world
    depends_on:
      postgres:
        condition: service_healthy
